name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Documentation
        run: cargo doc --workspace --no-deps
      - name: Minimum Rust version
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 check --workspace --all-features --locked
      - name: C header
        run: cc -x c -std=c11 -Wall -Wextra -Werror -fsyntax-only -Iinclude -include csgdb.h /dev/null
      - name: C ABI smoke test
        run: |
          cargo build -p csgdb-ffi
          cc -std=c11 -Wall -Wextra -Werror tests/c/ffi_smoke.c \
            -Iinclude -Ltarget/debug -lcsgdb \
            -Wl,-rpath,"$PWD/target/debug" \
            -o target/csgdb-ffi-smoke
          target/csgdb-ffi-smoke "$RUNNER_TEMP/csgdb-ffi-smoke.db"
